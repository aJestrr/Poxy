<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon TCG Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <h1>Pokémon TCG Arena</h1>
        </div>
        <p class="tagline">Every expansion · Real cards · Standard rules</p>
        <div id="api-key-banner" class="api-key-banner"></div>
      </header>

      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="packs"><span>📦</span> Open Packs</button>
        <button class="tab-btn" data-tab="decks"><span>🃏</span> My Decks</button>
        <button class="tab-btn" data-tab="battle"><span>⚔️</span> Battle</button>
        <button class="tab-btn" data-tab="collection"><span>📚</span> Collection</button>
      </nav>

      <main id="main" class="app-main"></main>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
